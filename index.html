// ==================== 状态管理 ====================
const StoryState = {
  currentChapterIndex: 0,
  currentSceneIndex: 0,
  decisions: [],
  visitedScenes: [],

  init() {
    this.loadProgress();
    this.renderProgressMarkers();
    this.renderCurrentScene();
  },

  makeDecision(decisionId, optionId) {
    this.decisions.push({ decisionId, optionId, timestamp: Date.now() });
    this.saveProgress();

    // 找到选项对应的下一章
    const chapter = storyData.chapters[this.currentChapterIndex];
    const option = chapter.decisionPoint.options.find(o => o.id === optionId);

    if (option && option.nextChapter) {
      const nextIndex = storyData.chapters.findIndex(c => c.id === option.nextChapter);
      if (nextIndex !== -1) {
        this.currentChapterIndex = nextIndex;
        this.currentSceneIndex = 0;
        this.renderCurrentScene();
      }
    }
  },

  nextScene() {
    const chapter = storyData.chapters[this.currentChapterIndex];
    if (this.currentSceneIndex < chapter.scenes.length - 1) {
      this.currentSceneIndex++;
      this.appendScene();
    } else if (chapter.decisionPoint) {
      // 显示决策点
      this.appendDecisionPoint();
    } else if (this.currentChapterIndex < storyData.chapters.length - 1) {
      // 自动进入下一章
      this.currentChapterIndex++;
      this.currentSceneIndex = 0;
      this.renderCurrentScene();
    } else {
      // 故事结束，显示反思页
      this.renderReflection();
    }
  },

  saveProgress() {
    localStorage.setItem('etLegAuntie_progress', JSON.stringify({
      currentChapterIndex: this.currentChapterIndex,
      currentSceneIndex: this.currentSceneIndex,
      decisions: this.decisions
    }));
  },

  loadProgress() {
    const saved = localStorage.getItem('etLegAuntie_progress');
    if (saved) {
      const data = JSON.parse(saved);
      this.currentChapterIndex = data.currentChapterIndex || 0;
      this.currentSceneIndex = data.currentSceneIndex || 0;
      this.decisions = data.decisions || [];
    }
  },

  reset() {
    this.currentChapterIndex = 0;
    this.currentSceneIndex = 0;
    this.decisions = [];
    this.visitedScenes = [];
    localStorage.removeItem('etLegAuntie_progress');
    this.renderCurrentScene();
  },

  renderProgressMarkers() {
    const markersContainer = document.getElementById('progress-markers');
    markersContainer.innerHTML = '';
    storyData.chapters.forEach((ch, i) => {
      const marker = document.createElement('div');
      marker.className = 'progress-marker';
      marker.dataset.year = ch.year;
      marker.dataset.index = i;
      markersContainer.appendChild(marker);
    });
  },

  updateProgressBar() {
    const progress = ((this.currentChapterIndex) / (storyData.chapters.length - 1)) * 100;
    document.getElementById('progress-fill').style.width = progress + '%';

    // 更新标记点
    document.querySelectorAll('.progress-marker').forEach((m, i) => {
      m.classList.toggle('active', i <= this.currentChapterIndex);
    });
  },

  updateBackground() {
    const chapter = storyData.chapters[this.currentChapterIndex];
    const bgLayer = document.getElementById('bg-layer');
    if (chapter.bgImage) {
      bgLayer.style.backgroundImage = `url(${chapter.bgImage})`;
      bgLayer.classList.add('active');
    }
  },

  renderCurrentScene() {
    this.updateProgressBar();
    this.updateBackground();

    const chapter = storyData.chapters[this.currentChapterIndex];
    const container = document.getElementById('story-container');

    let html = `
      <div class="chapter active" id="${chapter.id}">
        <div class="chapter-header">
          <div class="chapter-number">第 ${this.currentChapterIndex === 0 ? '零' : this.currentChapterIndex} 章</div>
          <h1 class="chapter-title" style="color: ${this.getChapterColor(chapter.theme)}">${chapter.title}</h1>
          <div class="chapter-year">${chapter.year}</div>
        </div>
    `;

    // 渲染当前场景及之前的场景
    for (let i = 0; i <= this.currentSceneIndex; i++) {
      const s = chapter.scenes[i];
      html += this.renderScene(s, i);
    }

    // 如果不是最后一个场景，显示"继续"按钮
    if (this.currentSceneIndex < chapter.scenes.length - 1) {
      html += `
        <div class="nav-buttons" id="nav-btn-container">
          <button class="nav-btn" onclick="StoryState.nextScene()">继续</button>
        </div>
      `;
    } else if (chapter.decisionPoint) {
      // 如果是最后一个场景且有决策点，显示决策点
      html += `<div id="decision-container">${this.renderDecisionButtons(chapter.decisionPoint)}</div>`;
    } else {
      // 章节结束，显示下一章按钮
      html += `
        <div class="nav-buttons" id="nav-btn-container">
          <button class="nav-btn" onclick="StoryState.nextScene()">
            ${this.currentChapterIndex < storyData.chapters.length - 1 ? '下一章' : '查看结局'}
          </button>
        </div>
      `;
    }

    html += '</div>';
    container.innerHTML = html;
  },

  appendScene() {
    this.updateProgressBar();
    this.updateBackground();

    const chapter = storyData.chapters[this.currentChapterIndex];
    const scene = chapter.scenes[this.currentSceneIndex];
    const chapterEl = document.getElementById(chapter.id);

    // 移除旧的导航按钮
    const oldNav = document.getElementById('nav-btn-container');
    if (oldNav) oldNav.remove();
    const oldDecision = document.getElementById('decision-container');
    if (oldDecision) oldDecision.remove();

    // 追加新场景
    const sceneHtml = this.renderScene(scene, this.currentSceneIndex);
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = sceneHtml;
    const sceneEl = tempDiv.firstElementChild;
    chapterEl.appendChild(sceneEl);

    // 滚动到新场景
    setTimeout(() => {
      sceneEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);

    // 如果不是最后一个场景，追加"继续"按钮
    if (this.currentSceneIndex < chapter.scenes.length - 1) {
      const navHtml = `
        <div class="nav-buttons" id="nav-btn-container">
          <button class="nav-btn" onclick="StoryState.nextScene()">继续</button>
        </div>
      `;
      const navTemp = document.createElement('div');
      navTemp.innerHTML = navHtml;
      chapterEl.appendChild(navTemp.firstElementChild);
    } else if (chapter.decisionPoint) {
      // 如果是最后一个场景且有决策点，显示决策点
      const decisionHtml = `<div id="decision-container">${this.renderDecisionButtons(chapter.decisionPoint)}</div>`;
      const decisionTemp = document.createElement('div');
      decisionTemp.innerHTML = decisionHtml;
      chapterEl.appendChild(decisionTemp.firstElementChild);
    } else {
      // 章节结束，显示下一章按钮
      const navHtml = `
        <div class="nav-buttons" id="nav-btn-container">
          <button class="nav-btn" onclick="StoryState.nextScene()">
            ${this.currentChapterIndex < storyData.chapters.length - 1 ? '下一章' : '查看结局'}
          </button>
        </div>
      `;
      const navTemp = document.createElement('div');
      navTemp.innerHTML = navHtml;
      chapterEl.appendChild(navTemp.firstElementChild);
    }
  },

  appendDecisionPoint() {
    const chapter = storyData.chapters[this.currentChapterIndex];
    const chapterEl = document.getElementById(chapter.id);

    // 移除旧的导航按钮
    const oldNav = document.getElementById('nav-btn-container');
    if (oldNav) oldNav.remove();

    // 追加决策点
    const decisionHtml = `<div id="decision-container">${this.renderDecisionButtons(chapter.decisionPoint)}</div>`;
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = decisionHtml;
    chapterEl.appendChild(tempDiv.firstElementChild);

    // 滚动到决策点
    setTimeout(() => {
      const decisionEl = document.getElementById('decision-container');
      if (decisionEl) decisionEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  },

  renderScene(scene, index) {
    let html = `<div class="scene" style="animation-delay: ${index * 0.1}s">`;

    switch (scene.type) {
      case 'narrative':
      case 'prologue':
        html += `<div class="scene-text">${scene.content}</div>`;
        break;
      case 'innerMonologue':
        html += `<div class="inner-monologue">${scene.content}</div>`;
        break;
      case 'chat':
        html += scene.content;
        break;
      case 'spotlight':
        html += scene.content;
        break;
      case 'notice':
        html += scene.content;
        break;
    }

    html += '</div>';
    return html;
  },

  renderDecisionButtons(decisionPoint) {
    let html = `
      <div class="decision-point">
        <div class="decision-question">${decisionPoint.question}</div>
        <div class="decision-options">
    `;

    decisionPoint.options.forEach(option => {
      html += `
        <button class="decision-btn" onclick="StoryState.makeDecision('${decisionPoint.id}', '${option.id}')">
          ${option.text}
        </button>
      `;
    });

    html += '</div></div>';
    return html;
  },

  renderDecisionPoint() {
    // 这个方法在 renderCurrentScene 中已经处理
    this.renderCurrentScene();
  },

  renderReflection() {
    const container = document.getElementById('story-container');
    const choicesHtml = this.decisions.map((d, i) => {
      const chapter = storyData.chapters.find(c => c.decisionPoint && c.decisionPoint.id === d.decisionId);
      const option = chapter?.decisionPoint?.options.find(o => o.id === d.optionId);
      return `<div class="choice-item">决策 ${i + 1}: ${option?.text || '未知选择'}</div>`;
    }).join('');

    container.innerHTML = `
      <div class="chapter active">
        <div class="chapter-header">
          <h1 class="chapter-title" style="color: var(--accent)">终局·反思</h1>
        </div>

        <div class="scene">
          <h2 style="font-family: var(--font-heading); margin-bottom: 1.5rem; color: var(--accent);">成本真相</h2>
          <table class="data-table">
            <thead>
              <tr><th>项目</th><th>鹅腿</th><th>鸭腿</th></tr>
            </thead>
            <tbody>
              <tr><td>批发成本</td><td>约11元/只</td><td>约2-5元/只</td></tr>
              <tr><td>市场零售价（生）</td><td>44-66元/斤</td><td>4-16元/斤</td></tr>
              <tr><td>"鹅腿阿姨"售价</td><td>16元（名义上）</td><td>16元（实际上）</td></tr>
              <tr><td>利润率</td><td>亏损</td><td>约200-700%</td></tr>
            </tbody>
          </table>
        </div>

        <div class="scene">
          <h2 style="font-family: var(--font-heading); margin-bottom: 1.5rem; color: var(--accent);">法律分析</h2>
          <div class="scene-text">
            <p>"以鸭腿冒充鹅腿且未向消费者如实告知，该行为存在触犯刑法的可能。"</p>
            <p>"销售金额达到五万元以上，即构成生产、销售伪劣产品罪。"</p>
            <p>"若售卖的肉制品存在变质问题，还将涉嫌生产、销售不符合安全标准的食品罪。"</p>
          </div>
        </div>

        <div class="scene">
          <div class="reflection-question">
            <p>你在这个故事中做了 ${this.decisions.length} 次选择。</p>
            <p>每一次，你都试图让结局变得更好。</p>
            <p>但结局始终一样。</p>
            <p style="margin-top: 1.5rem; color: var(--muted);">
              这不是一个关于"选择"的故事。<br>
              这是一个关于"谎言如何生长"的故事。
            </p>
          </div>
        </div>

        <div class="choice-record">
          <h3>你的选择记录</h3>
          ${choicesHtml || '<div class="choice-item">暂无选择记录</div>'}
        </div>

        <div class="nav-buttons">
          <button class="nav-btn" onclick="StoryState.reset()">重新开始</button>
          <button class="nav-btn secondary" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">回到顶部</button>
        </div>
      </div>
    `;

    window.scrollTo({ top: 0, behavior: 'smooth' });
  },

  getChapterColor(theme) {
    const colors = {
      'dark-red': 'var(--accent)',
      'warm-yellow': 'var(--ch1-primary)',
      'orange-red': 'var(--ch2-primary)',
      'gold': 'var(--ch3-primary)',
      'spotlight': 'var(--ch4-primary)',
      'green-glow': 'var(--ch5-secondary)',
      'neon-blue': 'var(--ch6-primary)',
      'grayscale-red': 'var(--ep-secondary)'
    };
    return colors[theme] || 'var(--ink)';
  }
};

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded', () => {
  StoryState.init();
});
</script>

</body>
</html>
